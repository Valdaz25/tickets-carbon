<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumador de tickets de carbón</title>
<style>
:root{--bg:#f1f0ec;--surface:#fff;--ink:#1d2321;--muted:#667069;--line:#d9d8d2;--accent:#1f5c4a;--accent-ink:#fff;--warn:#a4452c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a18;--surface:#1e2522;--ink:#e8ece9;--muted:#9aa59f;--line:#333d38;--accent:#6fc2a3;--accent-ink:#0f1a15;--warn:#e68a6e}}
:root[data-theme="dark"]{--bg:#151a18;--surface:#1e2522;--ink:#e8ece9;--muted:#9aa59f;--line:#333d38;--accent:#6fc2a3;--accent-ink:#0f1a15;--warn:#e68a6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.25rem;margin:0 0 14px;font-weight:700}
.total{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.total .n{font-size:2.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.total .l{opacity:.85;font-size:.9rem}
.sub{display:flex;gap:16px;margin-top:10px;font-size:.9rem;flex-wrap:wrap}
.sub b{font-variant-numeric:tabular-nums}
form,.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:4px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.net{font-size:.95rem;margin:0 0 12px}
button{font:inherit;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
.add{width:100%;background:var(--accent);color:var(--accent-ink);font-weight:700}
.ghost{background:none;color:var(--muted);padding:6px 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--muted)}
.item .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.msg{color:var(--warn);font-size:.85rem;min-height:1.2em;margin:8px 0 0}
.empty{color:var(--muted);margin:0}
.types{margin-top:12px;border-top:1px solid rgba(255,255,255,.35);padding-top:10px;display:grid;gap:4px;font-size:.95rem}
.types div{display:flex;justify-content:space-between;gap:8px}
.types b{font-variant-numeric:tabular-nums}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px}
.drop{display:block;border:2px dashed var(--accent);border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--surface);margin-bottom:12px}
.drop b{display:block;color:var(--accent);font-size:1.05rem}
.drop span{color:var(--muted);font-size:.85rem}
.drop input{display:none}
.status{margin:0 0 16px;font-size:.9rem;color:var(--muted)}
.status p{margin:2px 0}
.status .bad{color:var(--warn)}
.flag{color:var(--warn)}
details{margin-bottom:16px}
summary{cursor:pointer;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
</style>
</head>
<body>
<main>
<h1>Tickets de carbón</h1>

<section class="total" aria-live="polite">
  <div class="l">Total neto acumulado</div>
  <div class="n"><span id="tot">0,000</span> TN</div>
  <div class="sub">
    <span><b id="cnt">0</b> tickets</span>
    <span>Remisión: <b id="rem">0,000</b> TN</span>
    <span>Diferencia: <b id="dif">0,000</b> TN</span>
  </div>
  <div class="types">
    <div><span>Tradicional (<span id="c-trad">0</span>)</span><span><b id="t-trad">0,000</b> TN</span></div>
    <div><span>Antioquia (<span id="c-ant">0</span>)</span><span><b id="t-ant">0,000</b> TN</span></div>
    <div id="row-sin" hidden><span>Sin clasificar (<span id="c-sin">0</span>)</span><span><b id="t-sin">0,000</b> TN</span></div>
  </div>
</section>

<label class="drop" id="dz"><b>Subir fotos de tickets</b><span>Puedes elegir varias a la vez</span>
  <input id="up" type="file" accept="image/*" multiple></label>
<div class="status" id="st" aria-live="polite"></div>

<details id="man"><summary>Ingresar un ticket a mano</summary>
<form id="f" autocomplete="off">
  <label>Ticket (opcional)
    <input id="tk" placeholder="F201-0009679452">
  </label>
  <div class="row">
    <label>Peso entrada (TN)
      <input id="pe" inputmode="decimal" placeholder="52,430" required>
    </label>
    <label>Peso salida (TN)
      <input id="ps" inputmode="decimal" placeholder="18,440" required>
    </label>
  </div>
  <label>Tipo de carbón
    <select id="ty"><option value="tradicional">Tradicional</option><option value="antioquia">Antioquia</option></select>
  </label>
  <label>Cantidad remisión (TN, opcional)
    <input id="cr" inputmode="decimal" placeholder="34,250">
  </label>
  <p class="net">Neto: <b id="net">—</b></p>
  <button class="add" type="submit">Agregar ticket</button>
  <p class="msg" id="msg"></p>
</form>
</details>

<section class="list">
  <div class="head"><strong>Agregados</strong><button class="ghost" id="clr" type="button">Borrar todo</button></div>
  <div id="items"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
function fixDigits(t){return t.replace(/[$Ss]/g,'5').replace(/[Oo]/g,'0').replace(/[lI|]/g,'1').replace(/B/g,'8').replace(/Z/g,'2')}
function cand(str){
  if(!str||!/\d/.test(str))return [];
  var d=fixDigits(str).replace(/\D/g,''),out=[];
  function add(v){if(isFinite(v)&&out.indexOf(v)<0)out.push(v)}
  if(d.length>=4&&d.length<=6)add(parseInt(d,10)/1000);
  if(d.length>=1&&d.length<=3)add(parseInt(d,10));
  if(d.length>=5&&d.length<=7)for(var i=0;i<d.length;i++){var x=d.slice(0,i)+d.slice(i+1);if(x.length>=4&&x.length<=6)add(parseInt(x,10)/1000)}
  return out;
}
function detectTipo(text){
  var n=String(text).toUpperCase().replace(/[^A-Z0-9]/g,'');
  var a=/IVALTRAD|DSGROUP|DSGRUP|D5GROUP/.test(n),b=/MARGAR|MINAMARG/.test(n);
  return (a&&!b)?'tradicional':(b&&!a)?'antioquia':'';
}
function parseTicket(text){
  var t=text.replace(/\|/g,' ');
  var NUM='([\\d.,$SsOolIBZ|]+)';
  function g(re){var m=t.match(re);return m?m[1]:null}
  var tk=g(/Ticket\s*[:;.]?\s*([A-Z0-9][A-Z0-9\-\u2014\u2013]{5,})/i);
  if(tk)tk=tk.replace(/[\u2014\u2013]+/g,'-').replace(/-{2,}/g,'-');
  var E=cand(g(new RegExp('Entrada[\\s:;.]*'+NUM,'i'))),
      S=cand(g(new RegExp('Salida[\\s:;.]*'+NUM,'i'))),
      T=cand(g(new RegExp('\\bTotal[\\s:;.]*'+NUM,'i'))),
      R=cand(g(new RegExp('Cantidad\\s*Remisi\\S*[\\s:;.]*'+NUM,'i'))),
      r=R.length?R[0]:null,best=null;
  E.forEach(function(e,i){S.forEach(function(s,j){
    if(e<=s)return;
    T.forEach(function(x,k){
      if(Math.abs(e-s-x)<0.0015){var sc=i+j+k;if(!best||sc<best.sc)best={e:e,s:s,t:x,sc:sc}}
    });
  })});
  if(best){
    var ok=r==null||Math.abs(best.t-r)<=3;
    return {tk:tk||'',e:best.e,s:best.s,t:best.t,r:r,ok:ok};
  }
  if(E.length&&S.length&&E[0]>S[0])
    return {tk:tk||'',e:E[0],s:S[0],t:Math.round((E[0]-S[0])*1000)/1000,r:r,ok:false};
  return {tk:tk||'',ok:false};
}
(function(){
  var KEY="tickets-carbon", data=[];
  var $=function(i){return document.getElementById(i)};
  try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function num(s){
    s=String(s||"").trim().replace(/\s/g,"");
    if(!s)return NaN;
    s=s.replace(",",".");
    return /^\d*\.?\d+$/.test(s)||/^\d+\.$/.test(s)?parseFloat(s):NaN;
  }
  function fmt(n){return n.toLocaleString("es-CO",{minimumFractionDigits:3,maximumFractionDigits:3})}
  function render(){
    var t=0,r=0,rt=0;
    var by={tradicional:[0,0],antioquia:[0,0],"":[0,0]};
    data.forEach(function(d){t+=d.net;if(d.rem!=null){r+=d.rem;rt+=d.net}var k=by[d.tipo]?d.tipo:"";by[k][0]+=d.net;by[k][1]++});
    $("t-trad").textContent=fmt(by.tradicional[0]);$("c-trad").textContent=by.tradicional[1];
    $("t-ant").textContent=fmt(by.antioquia[0]);$("c-ant").textContent=by.antioquia[1];
    $("t-sin").textContent=fmt(by[""][0]);$("c-sin").textContent=by[""][1];
    $("row-sin").hidden=!by[""][1];
    $("tot").textContent=fmt(t);$("cnt").textContent=data.length;
    $("rem").textContent=fmt(r);$("dif").textContent=fmt(rt-r);
    var box=$("items");box.innerHTML="";
    if(!data.length){var p=document.createElement("p");p.className="empty";p.textContent="Aún no hay tickets. Agrega el primero arriba.";box.appendChild(p);return}
    data.slice().reverse().forEach(function(d){
      var i=data.indexOf(d),row=document.createElement("div");row.className="item";
      var l=document.createElement("div");
      var a=document.createElement("span");a.textContent=d.tk||"Ticket "+(i+1);
      var s=document.createElement("small");
      s.textContent="Entrada "+fmt(d.pe)+" − Salida "+fmt(d.ps)+(d.rem!=null?" · Remisión "+fmt(d.rem):"");
      if(d.warn){var w=document.createElement("small");w.className="flag";w.textContent="Revisa este ticket: la lectura no cuadra (entrada − salida ≠ total)";l.appendChild(a);l.appendChild(s);l.appendChild(w)}else{l.appendChild(a);l.appendChild(s)}
      var sel=document.createElement("select");sel.setAttribute("aria-label","Tipo de carbón");
      [["tradicional","Tradicional"],["antioquia","Antioquia"],["","Sin clasificar"]].forEach(function(o){var op=document.createElement("option");op.value=o[0];op.textContent=o[1];if((d.tipo||"")===o[0])op.selected=true;sel.appendChild(op)});
      sel.onchange=function(){d.tipo=sel.value;save();render()};
      l.appendChild(sel);
      var v=document.createElement("span");v.className="v";v.textContent=fmt(d.net)+" TN";
      var x=document.createElement("button");x.className="ghost";x.type="button";x.textContent="Quitar";x.setAttribute("aria-label","Quitar ticket");
      x.onclick=function(){data.splice(i,1);save();render()};
      row.appendChild(l);row.appendChild(v);row.appendChild(x);box.appendChild(row);
    });
  }
  function preview(){
    var e=num($("pe").value),s=num($("ps").value);
    $("net").textContent=(isNaN(e)||isNaN(s))?"—":fmt(e-s)+" TN";
  }
  $("pe").oninput=$("ps").oninput=preview;
  $("f").onsubmit=function(ev){
    ev.preventDefault();
    var e=num($("pe").value),s=num($("ps").value),c=num($("cr").value),tk=$("tk").value.trim(),m=$("msg");
    if(isNaN(e)||isNaN(s)){m.textContent="Revisa los pesos de entrada y salida: deben ser números.";return}
    if(e<s){m.textContent="El peso de entrada debe ser mayor que el de salida.";return}
    if(tk&&data.some(function(d){return d.tk===tk})){m.textContent="Ese ticket ya está en la lista.";return}
    m.textContent="";
    data.push({tk:tk,pe:e,ps:s,net:Math.round((e-s)*1000)/1000,rem:isNaN(c)?null:c,tipo:$("ty").value});
    save();render();$("f").reset();preview();$("tk").focus();
  };
  $("clr").onclick=function(){
    if(data.length&&confirm("¿Borrar todos los tickets?")){data=[];save();render()}
  };

  var busy=false,worker=null;
  function say(t,cls){var p=document.createElement("p");if(cls)p.className=cls;p.textContent=t;$("st").appendChild(p);return p}
  var CDN="https://cdn.jsdelivr.net/npm/";
  async function getWorker(line){
    if(worker)return worker;
    if(!window.Tesseract)throw {code:"engine",detail:"no se descargó tesseract.js"};
    line.textContent="Preparando el lector (solo la primera vez, puede tardar)…";
    try{
      worker=await Tesseract.createWorker("eng",1,{
        workerPath:CDN+"tesseract.js@5.1.1/dist/worker.min.js",
        corePath:CDN+"tesseract.js-core@5.1.1",
        langPath:CDN+"@tesseract.js-data/eng@1.0.0/4.0.0_best_int"
      });
      await worker.setParameters({tessedit_pageseg_mode:"6"});
    }catch(e){worker=null;throw {code:"engine",detail:errDetail(e)}}
    return worker;
  }
  function errDetail(e){
    if(!e)return "";
    if(typeof e==="string")return e.slice(0,80);
    return String(e.message||e.type||e.name||"").slice(0,80);
  }
  async function loadBmp(file){
    try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e1){}
    try{return await createImageBitmap(file)}catch(e2){}
    return await new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){res(im)};im.onerror=rej;im.src=u});
  }
  async function toCanvas(file,filter){
    var bmp=await loadBmp(file),bw=bmp.width||bmp.naturalWidth,bh=bmp.height||bmp.naturalHeight;
    var w=1800,h=Math.round(bh*w/bw);
    var c=document.createElement("canvas");c.width=w;c.height=h;
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);
    if(filter)x.filter="grayscale(1) contrast(1.4)";
    x.drawImage(bmp,0,0,w,h);
    return c;
  }
  async function readTicket(wk,file){
    var res=await wk.recognize(await toCanvas(file,true)),p=parseTicket(res.data.text),txt=res.data.text;
    if(!p.ok||!detectTipo(txt)){
      var res2=await wk.recognize(await toCanvas(file,false)),p2=parseTicket(res2.data.text);
      if(p2.ok&&!p.ok){p=p2;txt=res2.data.text}
      else if(!detectTipo(txt)&&detectTipo(res2.data.text))txt=txt+" "+res2.data.text;
    }
    return {p:p,txt:txt};
  }
  async function onFiles(files){
    if(busy||!files.length)return;busy=true;$("st").textContent="";
    for(var k=0;k<files.length;k++){
      var f=files[k],line=say("Leyendo "+(f.name||"imagen")+"…");
      try{
        var wk=await getWorker(line);line.textContent="Leyendo "+(f.name||"imagen")+"…";
        var rd=await readTicket(wk,f),p=rd.p;
        if(p.e==null||p.s==null||p.t==null||isNaN(p.t)||!(p.t>0))throw {code:"bad_read"};
        if(p.tk&&data.some(function(x){return x.tk===p.tk})){line.textContent=p.tk+": ya estaba en la lista, no se sumó.";line.className="bad";continue}
        var tipo=detectTipo(rd.txt);
        data.push({tk:p.tk,pe:p.e,ps:p.s,net:p.t,rem:p.r,warn:!p.ok,tipo:tipo});save();render();
        var nom={tradicional:"Tradicional",antioquia:"Antioquia","":"tipo sin identificar, elígelo en la lista"}[tipo];
        line.textContent=(p.tk||f.name)+": +"+fmt(p.t)+" TN · "+nom+(p.ok?"":" · revisar valores");
        if(!p.ok||!tipo)line.className="bad";
      }catch(e){
        console.error(e);
        var name=f.name||"Imagen";
        if(e&&e.code==="engine"){
          line.textContent="No se pudo iniciar el lector"+(e.detail?" ("+e.detail+")":"")+". Abre la app desde el navegador (Safari o Chrome) en su enlace de GitHub Pages, no desde una vista previa, y revisa tu conexión.";
          line.className="bad";break;
        }
        line.textContent=name+": "+(e&&e.code==="bad_read"?"No se pudieron leer los valores. Prueba con una foto más nítida o ingrésalo a mano.":"Falló la lectura"+(errDetail(e)?" ("+errDetail(e)+")":"")+".");
        line.className="bad";
      }
    }
    busy=false;$("up").value="";
  }
  $("up").onchange=function(){onFiles(Array.prototype.slice.call(this.files))};
  render();
})();
</script>
</body>
</html>
